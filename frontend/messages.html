<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Монеточка - Сообщения</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span>🪙 Монеточка</span>
                </a>
            </div>
            <div class="nav">
                <a href="feed.html" class="nav-button">📱 </a>
                <a href="messages.html" class="nav-button active">💬 </a>
                <a href="profile.html" class="nav-button">👤 </a>
                <a href="leaderboard.html" class="nav-button">🏆 </a>
                <button class="nav-button" onclick="authManager.logout()">🚪 </button>
            </div>
            <div class="coin-counter">
                🪙 <span id="coinCount">0</span>
            </div>
            <div class="online-indicator">
                <button id="onlineBtn" class="online-btn" title="Кто в сети">🟢</button>
                <div id="onlinePopup" class="online-popup"></div>
            </div>
        </div>

        <!-- Контейнер сообщений -->
        <div class="messages-container">
            <!-- Боковая панель -->
            <div class="conversations-sidebar">
                <div class="conversations-header">
                    <h3>💬 Сообщения</h3>
                    <input type="text" id="userSearch" class="form-input" placeholder="Поиск пользователей..."
                           style="margin-top: 10px;">
                    <button id="toggleUsersBtn" class="btn btn-secondary btn-small" style="margin-top: 5px;">👥 Все пользователи</button>
                </div>
                <div id="searchResults"></div>
                <div class="conversations-list" id="conversationsList"></div>
            </div>

            <!-- Область чата (растягивается, без фиксированной высоты) -->
            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
    <div>Выберите диалог</div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <div class="chat-input-form">
                        <input type="text" id="messageInput" class="form-input" placeholder="Введите сообщение..." disabled>
                        <button id="sendMsgBtn" class="btn btn-primary send-button" disabled>📨</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Плавающие кнопки прокрутки -->
    <div class="scroll-buttons">
        <button id="scrollUpBtn" class="scroll-btn" style="display: none;" title="Вверх">↑</button>
        <button id="scrollDownBtn" class="scroll-btn" style="display: none;" title="Вниз">↓</button>
    </div>

    <!-- Модалка для аватара -->
    <div id="avatarModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" id="closeAvatarModal">&times;</span>
            <img id="fullAvatar" src="" alt="Аватар">
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/messages.js"></script>
    <script>
        // Дополнительный контроль поля ввода (для совместимости)
        // new versiom
        setInterval(() => {
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendMsgBtn');
            if (messageManager && messageManager.currentConversation) {
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.placeholder = "Введите сообщение...";
            } else {
                messageInput.disabled = true;
                sendButton.disabled = true;
                messageInput.placeholder = "Выберите диалог для общения";
            }
        }, 500);
    </script>
</body>
</html>
