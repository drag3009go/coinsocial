<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монеточка - Сообщения</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
    window.VAPID_PUBLIC_KEY = 'BEN-beSTpDitLHtI3X4Ynq0en3RB502IaIElB3uWH3ey63rrpjz2q26xPNAjMNO3jGw6Si3yddsfisDeAq1lOyg';
</script>
</head>
<body>

    <!-- Модальное окно для увеличения аватара -->
<div id="avatarModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-modal" id="closeAvatarModal">&times;</span>
        <img id="fullAvatar" src="" alt="Аватар">
    </div>
</div>

    
    <div class="container">
        <div class="header">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span>🪙 Монеточка</span>
                </a>
            </div>
            <div class="nav">
                <a href="feed.html" class="nav-button">📱</a>
                <a href="messages.html" class="nav-button active">💬</a>
                <a href="profile.html" class="nav-button">👤</a>
                <a href="leaderboard.html" class="nav-button">🏆</a>
                <button class="nav-button" onclick="authManager.logout()">🚪</button>
            </div>
            <div class="coin-counter">
                🪙 <span id="coinCount">0</span>
            </div>
            <div class="online-indicator">
                <button id="onlineBtn" class="online-btn" title="Кто в сети">🟢</button>
                <div id="onlinePopup" class="online-popup"></div>
            </div>
        </div>

        <div class="messages-container">
            <div class="conversations-sidebar">
                <div class="conversations-header">
                    <h3>💬 Сообщения</h3>
                    <input type="text" id="userSearch" class="form-input" placeholder="Поиск пользователей..." style="margin-top: 10px; padding: 8px; font-size: 14px;">
                    <button id="toggleUsersBtn" class="btn btn-secondary btn-small" style="margin-top: 5px;">👥 Все пользователи</button>
                </div>
                <div id="searchResults"></div>
                <div class="conversations-list" id="conversationsList"></div>
            </div>

            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
                    <div>Выберите диалог</div>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="loading">Выберите диалог для начала общения</div>
                </div>
                <div class="chat-input-area">
                    <div class="chat-input-form">
                        <input type="text" id="messageInput" class="form-input" placeholder="Введите сообщение..." disabled>
                        <button id="sendMsgBtn" class="btn btn-primary send-button" disabled>📨</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/messages.js"></script>
    <script>
        // Дополнительная проверка
        console.log("messages.html loaded, messageManager type:", typeof messageManager);
        if (typeof messageManager === 'undefined') {
            console.error("CRITICAL: messageManager is undefined! Check messages.js loading.");
        } else {
            console.log("messageManager is ready.");
        }
    </script>
</body>
</html>
