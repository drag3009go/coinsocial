<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinSocial - Сообщения</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span>🪙 CoinSocial</span>
                </a>
            </div>
            <div class="nav">
                <a href="feed.html" class="nav-button">📱 Лента</a>
                <a href="messages.html" class="nav-button active">💬 Сообщения</a>
                <a href="profile.html" class="nav-button">👤 Профиль</a>
                <button class="nav-button" onclick="authManager.logout()">🚪 Выход</button>
            </div>
            <div class="coin-counter">
                🪙 <span id="coinCount">0</span>
            </div>
        </div>

        <div class="messages-container">
            <div class="conversations-sidebar">
                <div class="conversations-header">
                    <h3>💬 Сообщения</h3>
                    <input type="text" id="userSearch" class="form-input" placeholder="Поиск пользователей..."
                           style="margin-top: 10px; padding: 8px; font-size: 14px;">
                </div>
                <div id="searchResults"></div>
                <div class="conversations-list" id="conversationsList"></div>
            </div>

            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
                    <div>Выберите диалог</div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="loading">Выберите диалог для начала общения</div>
                </div>

                <div class="chat-input-area">
                    <div class="chat-input-form">
                        <input type="text" id="messageInput" class="form-input"
                               placeholder="Введите сообщение..." disabled>
                        <button class="btn btn-primary" onclick="messageManager.sendMessage()" disabled>
                            Отправить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/messages.js"></script>
    <script>
        // Включаем поле ввода когда выбран диалог
        setInterval(() => {
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.querySelector('.chat-input-form button');
            const isConversationSelected = messageManager.currentConversation !== null;

            messageInput.disabled = !isConversationSelected;
            sendButton.disabled = !isConversationSelected;

            if (isConversationSelected) {
                messageInput.placeholder = "Введите сообщение...";
            } else {
                messageInput.placeholder = "Выберите диалог для общения";
            }
        }, 100);
    </script>
</body>
</html>
