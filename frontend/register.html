<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монеточка - Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper .form-input {
            flex: 1;
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            user-select: none;
            font-size: 1.2rem;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }
        .debug-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span>🪙 Монеточка</span>
                </a>
            </div>
            <div class="nav">
                <a href="index.html" class="nav-button">🏠 Главная</a>
                <a href="login.html" class="nav-button">🚪 Вход</a>
            </div>
        </div>

        <!-- Отладочная информация (можно удалить) -->
        <div class="debug-info" id="debugInfo">
            Загрузка...
        </div>

        <div class="auth-card">
            <h1 class="auth-title">Регистрация</h1>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" id="username" class="form-input" required placeholder="Придумайте имя пользователя">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" required placeholder="Ваш email">
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" required placeholder="Не менее 6 символов" minlength="6">
                        <button type="button" class="toggle-password" aria-label="Показать/скрыть пароль">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Создать аккаунт
                </button>
            </form>

            <div class="auth-link">
                Уже есть аккаунт? <a href="login.html">Войдите</a>
            </div>
            <div id="message" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Переключение видимости пароля
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const wrapper = this.closest('.password-wrapper');
                const input = wrapper ? wrapper.querySelector('.form-input') : this.previousElementSibling;
                if (input && input.type === 'password') {
                    input.type = 'text';
                    this.textContent = '🙈';
                } else if (input) {
                    input.type = 'password';
                    this.textContent = '👁️';
                }
            });
        });

        function updateDebugInfo() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('currentUser');
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.innerHTML = `
                <strong>Отладочная информация:</strong><br>
                Токен: ${token ? '✅ Присутствует' : '❌ Отсутствует'}<br>
                Пользователь: ${user ? '✅ Загружен' : '❌ Отсутствует'}<br>
                Страница: ${window.location.href}
            `;
        }

        document.addEventListener('DOMContentLoaded', async function () {
            console.log('Register page loaded');
            updateDebugInfo();

            if (authManager.isAuthenticated()) {
                console.log('User already authenticated, redirecting to feed...');
                window.location.href = 'feed.html';
                return;
            }

            document.getElementById('registerForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const submitBtn = document.getElementById('submitBtn');
                const messageDiv = document.getElementById('message');

                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (!username || !email || !password) {
                    messageDiv.innerHTML = '<div style="color: red; text-align: center;">Все поля обязательны для заполнения</div>';
                    return;
                }
                if (password.length < 6) {
                    messageDiv.innerHTML = '<div style="color: red; text-align: center;">Пароль должен быть не менее 6 символов</div>';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Регистрация...';
                messageDiv.innerHTML = '<div style="color: blue; text-align: center;">Регистрация...</div>';

                const result = await authManager.register(username, email, password);
                if (result.success) {
                    messageDiv.innerHTML = '<div style="color: green; text-align: center;">✅ Регистрация успешна! Перенаправление...</div>';
                    setTimeout(() => {
                        window.location.href = 'feed.html';
                    }, 1000);
                } else {
                    messageDiv.innerHTML = `<div style="color: red; text-align: center;">❌ Ошибка: ${result.error}</div>`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Создать аккаунт';
                }
                updateDebugInfo();
            });

            setInterval(updateDebugInfo, 2000);
        });
    </script>
</body>
</html>
