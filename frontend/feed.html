<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монеточка - Лента</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
    window.VAPID_PUBLIC_KEY = 'BEN-beSTpDitLHtI3X4Ynq0en3RB502IaIElB3uWH3ey63rrpjz2q26xPNAjMNO3jGw6Si3yddsfisDeAq1lOyg';
</script>
</head>
<body>

    <!-- Модальное окно для увеличения аватара -->
<div id="avatarModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-modal" id="closeAvatarModal">&times;</span>
        <img id="fullAvatar" src="" alt="Аватар">
    </div>
</div>

    
    <div class="container">
        <div class="header">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span>🪙 Монеточка</span>
                </a>
            </div>
            <div class="nav">
                <a href="feed.html" class="nav-button active">📱</a>
                <a href="messages.html" class="nav-button">💬</a>
                <a href="profile.html" class="nav-button">👤</a>
                <a href="leaderboard.html" class="nav-button">🏆 </a>
                <button class="nav-button" onclick="authManager.logout()">🚪</button>
            </div>
            <div class="coin-counter">
                🪙 <span id="coinCount">0</span>
            </div>
            <div class="online-indicator">
                <button id="onlineBtn" class="online-btn" title="Кто в сети">🟢</button>
                <div id="onlinePopup" class="online-popup"></div>
            </div>
        </div>

        <div class="post-form">
            <form id="postForm">
                <textarea id="postContent" class="post-input" placeholder="Что у вас нового?" rows="3"></textarea>
                <div class="post-actions">
                    <label class="file-upload btn btn-secondary">
                        📎 Медиа
                        <input type="file" id="mediaInput" accept="image/*,video/*">
                    </label>
                    <button type="submit" class="btn btn-primary">Опубликовать (+5🪙)</button>
                </div>
                <input type="hidden" id="mediaUrl">
                <input type="hidden" id="mediaType">
                <div id="mediaPreview" class="media-preview"></div>
            </form>
        </div>

        <div id="feed"></div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
